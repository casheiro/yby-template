# Configuração Nginx para simular Datadog Agent
events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name localhost;

        # Mock Datadog metrics endpoint
        location /api/v1/series {
            return 200 '{"status": "ok", "message": "metrics received"}';
            add_header Content-Type application/json;
        }

        # Mock Datadog logs endpoint
        location /v1/input/ {
            return 200 '{"status": "ok", "message": "logs received"}';
            add_header Content-Type application/json;
        }

        # Mock health check
        location /health {
            return 200 '{"status": "healthy"}';
            add_header Content-Type application/json;
        }

        # Root endpoint
        location / {
            return 200 '{"service": "datadog-mock", "status": "running"}';
            add_header Content-Type application/json;
        }
    }
}