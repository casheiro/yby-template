# Serviços auxiliares para desenvolvimento local
# MinIO (S3), Datadog Agent mockado e ferramentas de debug

version: '3.8'

services:
  # MinIO - Armazenamento S3 local
  minio:
    image: minio/minio:latest
    container_name: minio-local
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - dev-network

  # Datadog Agent Mock - Para desenvolvimento local
  datadog-mock:
    image: nginx:alpine
    container_name: datadog-mock
    ports:
      - "8125:80"
    volumes:
      - ./datadog-mock.conf:/etc/nginx/nginx.conf:ro
    networks:
      - dev-network

  # Jaeger - Tracing distribuído (opcional)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger-local
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: true
    networks:
      - dev-network

  # PostgreSQL - Para desenvolvimento de aplicações (opcional)
  postgres:
    image: postgres:15-alpine
    container_name: postgres-local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: casheiro_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d casheiro_dev"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - dev-network

  # Redis - Cache e sessões (opcional)
  redis:
    image: redis:7-alpine
    container_name: redis-local
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dev-network

  # Grafana removido - usando Datadog para observabilidade

volumes:
  minio-data:
    driver: local
  minio-config:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  dev-network:
    driver: bridge