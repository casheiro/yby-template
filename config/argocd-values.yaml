# Configuração do Argo CD (Bootstrap)
# Usado pelo Makefile durante o 'make bootstrap-system'

server:
  service:
    type: ClusterIP
  
  # IMPORTANTE: Rodar em modo inseguro (HTTP) para permitir acesso via port-forward simples
  # Isso evita erros de "Client sent an HTTP request to an HTTPS server" e 404s
  insecure: true
  extraArgs:
    - --insecure

# Configurações adicionais podem ser adicionadas aqui
