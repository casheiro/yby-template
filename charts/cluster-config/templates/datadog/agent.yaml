{{- if or .Values.datadog.enabled (eq .Values.observability.mode "datadog") }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: datadog-agent
  namespace: {{ .Values.datadog.namespace }}
spec:
  selector:
    matchLabels:
      app: datadog-agent
  template:
    metadata:
      labels:
        app: datadog-agent
    spec:
      serviceAccountName: datadog-agent
      containers:
      - name: agent
        image: gcr.io/datadoghq/agent:latest
        env:
        - name: DD_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.datadog.secretName }}
              key: {{ .Values.datadog.secretKey }}
        - name: DD_SITE
          value: {{ .Values.datadog.site | quote }}
        - name: DD_TAGS
          value: {{ join "," .Values.datadog.tags | quote }}
{{- end }}