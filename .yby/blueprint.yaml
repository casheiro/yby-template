apiVersion: yby/v1alpha1
kind: Blueprint
metadata:
  name: standard-init
  description: "Standard Yby Cluster Initialization"

infrastructure:
  argocd:
    version: "5.51.6"
    chart: "argo/argo-cd"

prompts:
  - id: gitRepo
    type: input
    label: "URL do Repositório Git (seu fork):"
    default: "https://github.com/seu-usuario/yby-template"
    required: true
    target:
      file: "config/cluster-values.yaml"
      path: ".git.repoURL"

  - id: domain
    type: input
    label: "Domínio Base do Cluster (ex: cluster.com):"
    default: "yby.local"
    required: true
    target:
      file: "config/cluster-values.yaml"
      path: ".global.domainBase"

  - id: email
    type: input
    label: "Email para Let's Encrypt:"
    default: "admin@yby.local"
    required: true
    target:
      file: "config/cluster-values.yaml"
      path: ".ingress.tls.email"

  - id: org
    type: input
    label: "Organização GitHub (para Discovery):"
    default: "casheiro"
    target:
      file: "config/cluster-values.yaml"
      path: ".discovery.organization"

  - id: environment
    type: select
    label: "Ambiente:"
    options: ["dev", "staging", "prod"]
    default: "dev"
    target:
      file: "config/cluster-values.yaml"
      path: ".global.environment"

  - id: enableWhitelist
    type: select
    label: "Habilitar Whitelist de IP para serviços internos?"
    options: ["Não", "Sim"]
    default: "Não"
    actions:
      - condition: "Sim"
        target:
          file: "config/cluster-values.yaml"
          path: ".ingress.whitelist.enabled"
          value: true

  - id: whitelistIPs
    type: list
    label: "IPs/CIDRs permitidos (ex: 1.2.3.4, 10.0.0.0/8)"
    required: true # Agora pode ser required pois só aparece se Sim
    when:
      promptId: enableWhitelist
      value: "Sim"
    target:
      file: "config/cluster-values.yaml"
      path: ".ingress.whitelist.sourceRanges"

  - id: modules
    type: multiselect
    label: "Módulos Opcionais:"
    options: ["Kepler", "MinIO", "KEDA"]
    default: ["Kepler"]
    actions:
      - condition: "Kepler"
        target:
          file: "config/cluster-values.yaml"
          path: ".kepler.enabled"
          value: true
      - condition: "MinIO"
        target:
          file: "config/cluster-values.yaml"
          path: ".storage.minio.enabled"
          value: true
      - condition: "KEDA"
        target:
          file: "config/cluster-values.yaml"
          path: ".keda.enabled"
          value: true
